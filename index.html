<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to WebP Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .input-section, .output-section {
            margin-bottom: 20px;
        }

        .input-section input {
            display: none;
        }

        .input-section label {
            display: block;
            background-color: #3a3a3a;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .input-section label:hover {
            background-color: #4a4a4a;
        }

        .output-section {
            display: none;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .image-item {
            background-color: #3a3a3a;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .image-item img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .image-item a {
            display: block;
            margin-top: 10px;
            color: #1e90ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .image-item a:hover {
            text-decoration: underline;
        }

        .download-all {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #1e90ff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .download-all:hover {
            background-color: #1c86ee;
        }

        .download-all:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image to WebP Converter</h1>
        <div class="input-section">
            <input type="file" id="imageInput" accept="image/*" multiple>
            <label for="imageInput">Select Images (JPG, PNG, etc.)</label>
        </div>
        <div class="output-section">
            <div class="image-grid" id="imageGrid"></div>
            <button class="download-all" id="downloadAll" disabled>Download All as ZIP</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageInput');
        const imageGrid = document.getElementById('imageGrid');
        const outputSection = document.querySelector('.output-section');
        const downloadAllBtn = document.getElementById('downloadAll');
        let webpFiles = [];

        imageInput.addEventListener('change', handleImageUpload);

        async function handleImageUpload(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            imageGrid.innerHTML = '';
            webpFiles = [];
            outputSection.style.display = 'block';
            downloadAllBtn.disabled = true;

            for (const file of files) {
                try {
                    const webpBlob = await convertToWebP(file);
                    webpFiles.push({ name: file.name.replace(/\.[^/.]+$/, '.webp'), blob: webpBlob });
                    displayImage(webpBlob, file.name);
                } catch (error) {
                    console.error('Error converting image:', error);
                }
            }

            downloadAllBtn.disabled = webpFiles.length === 0;
        }

        function convertToWebP(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(blob => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('WebP conversion failed'));
                        }
                    }, 'image/webp', 1.0); // Quality set to 1.0 for lossless
                };
                img.onerror = () => reject(new Error('Image loading failed'));
                img.src = URL.createObjectURL(file);
            });
        }

        function displayImage(blob, originalName) {
            const webpName = originalName.replace(/\.[^/.]+$/, '.webp');
            const imgUrl = URL.createObjectURL(blob);

            const imageItem = document.createElement('div');
            imageItem.className = 'image-item';

            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = webpName;

            const downloadLink = document.createElement('a');
            downloadLink.href = imgUrl;
            downloadLink.download = webpName;
            downloadLink.textContent = 'Download WebP';

            imageItem.appendChild(img);
            imageItem.appendChild(downloadLink);
            imageGrid.appendChild(imageItem);
        }

        downloadAllBtn.addEventListener('click', async () => {
            if (webpFiles.length === 0) return;

            const zip = new JSZip();
            webpFiles.forEach(file => {
                zip.file(file.name, file.blob);
            });

            try {
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'images.zip';
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error creating ZIP:', error);
            }
        });
    </script>
</body>
</html>
